<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">

    <title>Customer Dashboard</title>
    <style>
        .dashboard {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            padding-top: 60px;
        }

        p {
            color: #555;
            font-size: 18px;
            text-align: center;
        }

        .dashboard-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logout-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .logout-button:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <nav class="navbar">
            <div class="container">
                <div class="logo">E-Hotels</div>
                <ul class="nav-links">
                    <li><a href="../register/register.html">Register Yourself</a></li>
                    <li><a href="../search/index.html">Book Room</a></li>
                    <li><a href="../customer-dashboard/customer-dashboard.html">Dash</a></li>
                </ul>
            </div>
        </nav>

        <div class="dashboard-container">
            <h2>Welcome to the Customer Dashboard</h2>
            <p id="greetingMessage">Loading...</p>
            <button class="logout-button" id="logoutButton">Logout</button>
        </div>
    </div>

    <script>
        if (!sessionStorage.getItem('username') || !sessionStorage.getItem('role')) {
            const urlParams = new URLSearchParams(window.location.search);
            const urlUsername = urlParams.get('username');
            const urlRole = urlParams.get('role');

            if (urlUsername && urlRole) {
                sessionStorage.setItem('username', urlUsername);
                sessionStorage.setItem('role', urlRole);
            }
        }

        const username = sessionStorage.getItem('username') || 'Guest';
        const role = sessionStorage.getItem('role') || 'customer';

        document.getElementById('greetingMessage').textContent = `Hello, ${username}! You are logged in as a ${role}.`;

        document.getElementById('logoutButton').addEventListener('click', () => {
            sessionStorage.clear();

            window.location.href = '../index.html';
        });
    </script>

</body>
</html>
