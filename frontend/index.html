<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Hotels</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
    <script src="script.js"></script>
    <style>
        /* Center the main content */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 20px;
        }

        /* Style for Register and Sign In buttons */
        .auth-buttons {
            margin: 20px 0;
        }

        .auth-buttons a {
            text-decoration: none;
            margin: 0 10px;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .register-button {
            background-color: #4CAF50;
            color: white;
        }

        .register-button:hover {
            background-color: #45a049;
        }

        .signin-button {
            background-color: #007bff;
            color: white;
        }

        .signin-button:hover {
            background-color: #0056b3;
        }

        /* Style the table for search results */
        #roomSearchResults {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        #roomSearchResults th, #roomSearchResults td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        #roomSearchResults th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">

    </nav>

    <!-- Main content -->
    <div class="main-container">
        <h1>Welcome to E-Hotels</h1>
        <p>Your one-stop solution for hotel bookings and management.</p>

        <!-- Register and Sign In buttons -->
        <div class="auth-buttons">
            <a href="./registeruser/registeruser.html" class="register-button">Register</a>
            <a href="./signin/signin.html" class="signin-button">Sign In</a>
        </div>
    </div>

</body>
</html>
