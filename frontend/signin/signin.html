<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* General styles for the body */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        h2 {
            color: #333;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        /* Style the login form container */
        #loginForm {
            background-color: #ffffff;
            padding: 30px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Style input fields */
        #loginForm input[type="text"],
        #loginForm input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        /* Add a subtle effect to input fields on focus */
        #loginForm input[type="text"]:focus,
        #loginForm input[type="password"]:focus {
            border-color: #007bff;
            outline: none;
        }

        /* Style the submit button */
        #loginForm button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        #loginForm button[type="submit"]:hover {
            background-color: #0056b3;
        }

        /* Responsive styling */
        @media (max-width: 500px) {
            #loginForm {
                padding: 20px 15px;
            }

            h2 {
                font-size: 20px;
            }

            #loginForm button[type="submit"] {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div>
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="usernameLogin" placeholder="Username" required>
            <input type="password" id="passwordLogin" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('usernameLogin').value;
            const password = document.getElementById('passwordLogin').value;
    
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
    
            const result = await response.json();
            if (response.ok) {
                alert(result.message);
                if (result.role === 'admin') {
                window.location.replace(`../admin-dashboard/admin-dashboard.html?username=${encodeURIComponent(result.username)}&role=${encodeURIComponent(result.role)}`);
            } else if (result.role === 'customer') {
                window.location.replace(`../customer-dashboard/customer-dashboard.html?username=${encodeURIComponent(result.username)}&role=${encodeURIComponent(result.role)}`);
            } else {
                window.location.replace(`../index.html?username=${encodeURIComponent(result.username)}&role=${encodeURIComponent(result.role)}`);
            }


            } else {
                alert(result.error);
            }
        });
    </script>
    

</body>
</html>
